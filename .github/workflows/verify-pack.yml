name: Verify Harness

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Historical installer fixture uses the reviewed baseline commit.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest (guardrail unit tests)
        run: python -m pip install --quiet pytest

      - name: Make shell scripts executable
        run: chmod +x scripts/*.sh

      - name: Verify PossibNow Dev Harness
        run: ./scripts/verify-pack.sh
